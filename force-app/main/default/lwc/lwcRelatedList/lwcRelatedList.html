<template>
    <!-- Error block -->
    <template if:true={error}>
        <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
            <span class="slds-assistive-text">error</span>
            <p>{error}</p>
        </div>
    </template>
    <!-- Main content -->
    <lightning-card variant="Narrow" title={titleFormatted} icon-name={iconName} class={componentClass}>
        <!-- custom action buttons for list, by default new is displayed -->
        <template if:true={actionButtons}>
            <template for:each={actionButtons} for:item="actionButton" for:index="index">
                <lightning-button
                    key={actionButton.label}
                    label={actionButton.label}
                    title={actionButton.label}
                    variant={actionButton.variant}
                    onclick={handleButtonAction}
                    data-name={actionButton.name}
                    class="slds-p-left_xx-small"
                    slot="actions"
                    disabled={actionButton.disabled}
                >
                </lightning-button>
            </template>
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text={paginationLabels.refresh}
                onclick={init}
                slot="actions"
                class="slds-p-left_xx-small button-refresh"
                lwc:ref="refreshButton"
            ></lightning-button-icon>
        </template>

        <!-- GLOBAL SOSL SEARCH BAR + LOOKUP FILTER -->
        <lightning-layout>
            <lightning-layout-item flexibility="auto" padding="around-small" if:true={hasSearchBar}>
                <div>
                    <lightning-input name="enter-search" label="Search" type="search" onchange={onSearchChange}></lightning-input>
                </div>
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto" padding="around-small" if:true={islookupFilter}>
                <div>
                    <c-datatable-lookup-filter
                        config={lookupFilterConfigJSON}
                        onlookupfilter={handleLookupFilter}
                    ></c-datatable-lookup-filter>
                </div>
            </lightning-layout-item>
        </lightning-layout>

        <!-- FIELDS SOQL SEARCH BARS -->
        <lightning-layout>
            <template for:each={fieldsSearchBars} for:item="searchBar" for:index="index">
                <lightning-layout-item key={searchBar.label} flexibility="auto" padding="around-small">
                    <div>
                        <lightning-input name={searchBar.fieldName} label={searchBar.label} data-fieldname={searchBar.fieldName} placeholder={searchBar.placeholder} type="search" onchange={onFieldSearchChange}></lightning-input>
                    </div>
                </lightning-layout-item>
            </template>
        </lightning-layout>

        <!-- Data table  -->
        <template lwc:if={data}>
            <!-- DATATABLE WITH CHECKBOXES -->
            <c-extended-datatable
                hide-checkbox-column={showCheckboxes}
                key-field="Id"
                data={data}
                columns={columns}
                onrowaction={handleRowAction}
                onrowselection={handleRowSelection}
                onsave={handleSave}
                draft-values={draftValues}
                sorted-direction={sortDirection}
                onsort={handleSort}
                sorted-by={sortBy}
                onpicklistchanged={customTypeChanged}
                onlookupchanged={customTypeChanged}
                ontextareachanged={customTypeChanged}
                is-loading={isloading}
                max-row-selection={maxRowSelection}
            >
            </c-extended-datatable>
            <template lwc:if={showNoResultMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_info" role="alert">
                    {noResultMessage}
                </div>
            </template>
        </template>
        <c-loader lwc:else size="medium" is-loading=true full-width alternative-text="Loading">
        </c-loader>

        <!-- Pagination -->
        <div slot="footer" style="text-align: right" if:true={hasPagination}>
            <lightning-button
                variant="brand"
                disabled={isDisablePrev}
                label={paginationLabels.first}
                title={paginationLabels.first}
                onclick={firstPage}
                class="slds-m-left_xx-small"
            ></lightning-button>
            <lightning-button
                variant="brand"
                disabled={isDisablePrev}
                label={paginationLabels.previous}
                title={paginationLabels.previous}
                onclick={previous}
                class="slds-m-left_xx-small"
            ></lightning-button>
            <span
                class="slds-m-left_xx-small slds-m-right_xx-small">
                {paginationLabels.prefix}{page}{paginationLabels.separator}{totalPages}{paginationLabels.suffix}
            </span>
            <lightning-button
                variant="brand"
                disabled={isDisableNext}
                label={paginationLabels.next}
                title={paginationLabels.next}
                onclick={next}
                class="slds-m-left_xx-small"
            ></lightning-button>
            <lightning-button
                variant="brand"
                disabled={isDisableNext}
                label={paginationLabels.last}
                title={paginationLabels.last}
                onclick={lastPage}
                class="slds-m-left_xx-small slds-m-right_xx-small"
            ></lightning-button>
        </div>

        <footer class="slds-card__footer" if:true={hasToShowViewAll}>
            <lightning-button variant="base" label="View all" title="View all" onclick={showAllRecords}> </lightning-button>
        </footer>
        <footer class="slds-card__footer" if:true={showCollapse}>
            <lightning-button variant="base" label="Collapse" title="Collapse" onclick={showInitialRecordsWithLimit}> </lightning-button>
        </footer>
    </lightning-card>
</template>
